services:
  windows-vm:
    image: dockurr/windows:latest
    container_name: myo-windows-vm
    restart: unless-stopped
    # Guest disk only; do not mount host or client filesystem paths.
    environment:
      VERSION: "11"
      RAM_SIZE: "${MYO_VM_RAM:-16G}"
      CPU_CORES: "${MYO_VM_CPU_CORES:-6}"
      DISK_SIZE: "${MYO_VM_DISK_SIZE:-256G}"
      USERNAME: "${MYO_WINDOWS_USER:-myo}"
      PASSWORD: ${MYO_WINDOWS_PASSWORD:?Run scripts/bootstrap-windows-pc.sh first}
      LANGUAGE: "${MYO_WINDOWS_LANGUAGE:-English}"
      REGION: "${MYO_WINDOWS_REGION:-en-US}"
      KEYBOARD: "${MYO_WINDOWS_KEYBOARD:-en-US}"
      TPM: "Y"
    devices:
      - /dev/kvm:/dev/kvm
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    shm_size: "1gb"
    stop_grace_period: 2m
    volumes:
      - myo_windows_storage:/storage
    networks: [myo_internal]

  caddy:
    image: caddy:2-alpine
    container_name: myo-windows-gateway
    restart: unless-stopped
    depends_on:
      - windows-vm
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      MYO_DOMAIN: ${MYO_DOMAIN:?Run scripts/bootstrap-windows-pc.sh with domain}
      MYO_PROXY_USER: ${MYO_PROXY_USER:-myo}
      MYO_PROXY_PASSWORD_HASH: ${MYO_PROXY_PASSWORD_HASH:?Run bootstrap to generate hash}
    volumes:
      - ./cloud-pc/Caddyfile:/etc/caddy/Caddyfile:ro
      - myo_caddy_data:/data
      - myo_caddy_config:/config
    networks: [myo_internal]

  myo-disk-server:
    build:
      context: ./server
    container_name: myo-disk-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      PORT: "8787"
      NODE_ENV: "production"
      MYO_DATA_DIR: "/data"
      MYO_SERVER_TOKEN: ${MYO_SERVER_TOKEN:?Set MYO_SERVER_TOKEN}
      MYO_CORS_ORIGIN: ${MYO_CORS_ORIGIN:-}
      MYO_MAX_FILE_BYTES: ${MYO_MAX_FILE_BYTES:-67108864}
      MYO_DEFAULT_DISK_QUOTA_BYTES: ${MYO_DEFAULT_DISK_QUOTA_BYTES:-1073741824}
    volumes:
      - myo_disk_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [myo_internal]

networks:
  myo_internal:
    driver: bridge

volumes:
  myo_windows_storage:
    name: myo_windows_storage
  myo_caddy_data:
    name: myo_caddy_data
  myo_caddy_config:
    name: myo_caddy_config
  myo_disk_data:
    name: myo_disk_data
